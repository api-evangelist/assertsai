aid: assertsai
name: Asserts.ai
description: >-
  Asserts.ai is an observability intelligence platform for Prometheus and
  OpenTelemetry that automatically models the entities in your infrastructure
  and application metrics, applies golden-signal and SLO PromQL rules to surface
  anomalies, and correlates related failures into root-cause workbenches to cut
  mean-time-to-resolution. It also ships a Data Distiller for reducing metric
  cardinality and observability cost. Asserts was acquired by Grafana Labs in
  November 2023 and is now delivered as part of Grafana Cloud; its standalone
  website, docs, and GitHub organization are archived and no longer maintained.
